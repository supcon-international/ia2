[package]
name = "iomap-canopen"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tokio.workspace = true
tracing.workspace = true
async-trait.workspace = true
nusb = { version = "0.2.7", features = ["tokio"] }

iocore = { path = "../iocore" }
project = { path = "../project" }

# SocketCAN is a Linux kernel interface; the real transport only exists
# there. Windows uses gs_usb-compatible USB adapters via nusb/WinUSB;
# `_sim` remains available on every platform for offline tests.
[target.'cfg(target_os = "linux")'.dependencies]
socketcan = { version = "3.5", features = ["tokio"] }
