[package]
name = "iomap-ethercat"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tokio.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true

iocore = { path = "../iocore" }
project = { path = "../project" }
esi = { path = "../esi" }

# Keep the existing Unix raw-socket implementation.
[target.'cfg(unix)'.dependencies]
ethercrab = { workspace = true, default-features = true }
smol.workspace = true

# Use the protocol core without upstream's statically linked Windows
# transport. Npcap is loaded only when a real EtherCAT device is opened.
[target.'cfg(windows)'.dependencies]
ethercrab = { workspace = true, default-features = false }
smol.workspace = true
embassy-time = { version = "0.4.0", features = ["std", "generic-queue-128"] }
libloading = "0.8.9"
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation", "Win32_System_LibraryLoader", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis"] }
